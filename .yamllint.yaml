extends: default

ignore: |
  custom_components/
  blueprints/

rules:
  # HA files don't use document start markers
  document-start: disable

  # HA configs commonly have long lines (entity IDs, templates, etc.)
  line-length:
    max: 250
    level: warning

  # HA uses both sequence indentation styles (HA auto-generates unindented sequences)
  indentation:
    spaces: 2
    indent-sequences: whatever

  # Allow multiple blank lines (used for readability between card sections)
  empty-lines:
    max: 2

  # HA automation/script IDs are often quoted numbers — allow both
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  # Comments are heavily used in dashboards
  comments:
    min-spaces-from-content: 1

  comments-indentation: disable
