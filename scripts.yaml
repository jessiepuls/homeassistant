turn_off_three_season_porch_heater:
  alias: Turn off three season porch heater
  sequence:
  - condition: state
    entity_id: switch.heater
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.heater
  mode: single
  icon: mdi:fireplace

bedtime:
  alias: Bedtime
  icon: mdi:sleep
  mode: single
  sequence:
  - action: media_player.turn_off
    target:
      entity_id: media_player.upstairs_tv
  - action: light.turn_on
    data:
      brightness_pct: 30
    target:
      entity_id: light.hallway_main_lights
  - action: light.turn_off
    target:
      area_id:
      - kitchen
      - living_room
      - outdoors
      - dining_room
  - action: switch.turn_off
    target:
      area_id:
      - outdoors
      - living_room
  - action: light.turn_off
    target:
      entity_id: light.three_season_porch_lamps
  - action: script.turn_off_three_season_porch_heater

play_music_three_season_porch:
  alias: Play music on the three season porch
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.three_season_porch_sonos
    data:
      media_content_type: "SPOTIFY"
      media_content_id: "shuffle playlist Daily Mix 1"
