turn_off_three_season_porch_heater:
  alias: Turn off three season porch heater
  sequence:
  - condition: state
    entity_id: switch.heater
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.heater
  mode: single
  icon: mdi:fireplace

bedtime:
  alias: Bedtime
  icon: mdi:sleep
  mode: single
  sequence:
  - action: script.bedroom_temperature_early_bedtime
    continue_on_error: true
  # Keep device failures from interrupting the rest of the routine.
  - if:
    - condition: template
      value_template: "{{ states('media_player.upstairs_tv') not in ['unknown', 'unavailable', 'off'] }}"
    then:
    - action: media_player.turn_off
      target:
        entity_id: media_player.upstairs_tv
      continue_on_error: true
  - action: light.turn_on
    continue_on_error: true
    target:
      entity_id: light.bedroom_nightstand_lamps
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id:
      - light.hallway_main_lights
      - light.stairs_main_lights
  - action: light.turn_off
    continue_on_error: true
    target:
      area_id:
      - kitchen
      - living_room
      - outdoors
      - dining_room
  - action: switch.turn_off
    continue_on_error: true
    target:
      area_id:
      - outdoors
      - living_room
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id: light.three_season_porch_lamps
  - action: script.turn_off_three_season_porch_heater
    continue_on_error: true
  # Stop each active Music Assistant player separately so one offline speaker
  # cannot prevent other speakers or the rest of bedtime from being handled.
  - repeat:
      for_each:
      - media_player.living_room_2
      - media_player.office_2
      - media_player.dining_room_2
      - media_player.three_season_porch
      - media_player.bedroom_2
      - media_player.basement_2
      - media_player.record_player
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) in ['playing', 'paused', 'buffering'] }}"
        then:
        - action: media_player.media_stop
          target:
            entity_id: '{{ repeat.item }}'
          continue_on_error: true

music_switch_destination:
  alias: Music - switch listening destination
  description: Move the playing queue to the selected destination, replacing the previous speaker group.
  mode: single
  fields:
    destination:
      required: true
      selector:
        select:
          options:
          - Main Floor
          - Everywhere
          - Bedroom
          - Basement
          - Record Player
  sequence:
  - variables:
      destinations:
        Main Floor:
        - media_player.living_room_2
        - media_player.office_2
        - media_player.dining_room_2
        - media_player.three_season_porch
        - media_player.bedroom_2
        Everywhere:
        - media_player.living_room_2
        - media_player.office_2
        - media_player.dining_room_2
        - media_player.three_season_porch
        - media_player.bedroom_2
        - media_player.basement_2
        - media_player.record_player
        Bedroom:
        - media_player.bedroom_2
        Basement:
        - media_player.basement_2
        Record Player:
        - media_player.record_player
      queue_entities:
        RINCON_74CA60C37DB801400: media_player.bedroom_2
        RINCON_F0F6C172D5EB01400: media_player.living_room_2
        RINCON_F0F6C1AE9FB801400: media_player.dining_room_2
        RINCON_C4387521378201400: media_player.three_season_porch
        RINCON_74CA60C33D2E01400: media_player.office_2
        RINCON_48A6B8423BC501400: media_player.basement_2
        RINCON_38420B82206401400: media_player.record_player
  - if:
    - condition: template
      value_template: '{{ destination not in destinations }}'
    then:
    - stop: Unknown music destination
      error: true
  - variables:
      desired: '{{ destinations[destination] }}'
      previous: '{{ destinations.get(states(''input_select.music_destination''), destinations[''Main Floor''])[0] }}'
      playing: '{{ expand(destinations.values() | sum(start=[])) | selectattr(''state'', ''eq'', ''playing'') | map(attribute=''entity_id'') | list }}'
      paused: '{{ expand(destinations.values() | sum(start=[])) | selectattr(''state'', ''eq'', ''paused'') | map(attribute=''entity_id'') | list }}'
      starting_volume: "{{ 0.30 if destination == 'Main Floor' else 0.20 }}"
  - variables:
      source_candidate: '{{ previous if previous in playing else (playing | first | default(previous if previous in paused else (paused | first | default('''')))) }}'
      target_player: '{{ desired[0] }}'
  - variables:
      source: '{{ queue_entities.get(state_attr(source_candidate, ''active_queue''), source_candidate) if source_candidate else '''' }}'
  - repeat:
      for_each: '{{ desired }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(repeat.item) in [''unknown'', ''unavailable''] }}'
        then:
        - stop: A selected speaker is unavailable
          error: true
  - if:
    - condition: template
      value_template: '{{ source != '''' and source != target_player }}'
    then:
    - action: music_assistant.transfer_queue
      target:
        entity_id: '{{ target_player }}'
      data:
        source_player: '{{ source }}'
        auto_play: '{{ is_state(source, ''playing'') }}'
  - variables:
      current_members: '{{ state_attr(target_player, ''group_members'') or [target_player] }}'
  - variables:
      extras: '{{ current_members | reject(''in'', desired) | list }}'
  - repeat:
      for_each: '{{ extras }}'
      sequence:
      - action: media_player.unjoin
        target:
          entity_id: '{{ repeat.item }}'
      - action: media_player.media_stop
        target:
          entity_id: '{{ repeat.item }}'
  - if:
    - condition: template
      value_template: '{{ desired | length > 1 }}'
    then:
    - action: media_player.join
      target:
        entity_id: '{{ target_player }}'
      data:
        group_members: '{{ desired[1:] }}'
  - if:
    - condition: template
      value_template: '{{ destination in [''Main Floor'', ''Everywhere''] and is_number(starting_volume) and 0 <= starting_volume | float <= 1 }}'
    then:
    - repeat:
        for_each: '{{ desired }}'
        sequence:
        - action: media_player.volume_set
          target:
            entity_id: '{{ repeat.item }}'
          data:
            volume_level: '{{ starting_volume | float }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.music_destination
    data:
      option: '{{ destination }}'
  max_exceeded: silent
  trace:
    stored_traces: 10

music_refresh_library:
  alias: Music - refresh dashboard rows
  mode: single
  sequence:
    - event: music_library_refresh

music_play_collection:
  alias: Music - play a dashboard collection
  mode: single
  fields:
    uri:
      required: true
      selector:
        text:
    media_type:
      required: true
      selector:
        select:
          options:
            - playlist
            - album
            - radio
            - track
            - artist
            - podcast_episode
            - audiobook
    radio_mode:
      name: Start a station
      default: false
      selector:
        boolean:
  sequence:
    - variables:
        destinations:
          Main Floor:
            - media_player.living_room_2
            - media_player.office_2
            - media_player.dining_room_2
            - media_player.three_season_porch
            - media_player.bedroom_2
          Everywhere:
            - media_player.living_room_2
            - media_player.office_2
            - media_player.dining_room_2
            - media_player.three_season_porch
            - media_player.bedroom_2
            - media_player.basement_2
            - media_player.record_player
          Bedroom:
            - media_player.bedroom_2
          Basement:
            - media_player.basement_2
          Record Player:
            - media_player.record_player
        destination: "{{ states('input_select.music_destination') }}"
    - if:
        - condition: template
          value_template: "{{ destination not in destinations or media_type not in ['playlist', 'album', 'radio', 'track', 'artist', 'podcast_episode', 'audiobook'] or not uri }}"
      then:
        - stop: Invalid music destination or collection
          error: true
    - variables:
        desired: "{{ destinations[destination] }}"
    - if:
        - condition: template
          value_template: >-
            {{ (state_attr(desired[0], 'group_members') or [desired[0]]) | sort != desired | sort }}
      then:
        - action: script.music_switch_destination
          data:
            destination: "{{ destination }}"
    # Resume loaded spoken audio directly instead of replacing its queue item.
    - if:
        - condition: template
          value_template: >-
            {{ media_type in ['podcast_episode', 'audiobook'] and state_attr(desired[0], 'media_content_id') == uri }}
      then:
        - if:
            - condition: template
              value_template: "{{ not is_state(desired[0], 'playing') }}"
          then:
            - action: media_player.media_play
              target:
                entity_id: "{{ desired[0] }}"
        - stop: Spoken audio is already loaded
    - action: music_assistant.play_media
      target:
        entity_id: "{{ desired[0] }}"
      data:
        media_id: "{{ uri }}"
        media_type: "{{ media_type }}"
        enqueue: replace
        radio_mode: "{{ media_type not in ['audiobook', 'podcast_episode'] and radio_mode | default(false) | bool }}"

music_open_podcast:
  alias: Music - show podcast episodes
  mode: single
  fields:
    uri:
      required: true
      selector:
        text:
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.music_podcast_selected
      data:
        value: "{{ uri }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.music_search_query
      data:
        value: ""

music_search:
  alias: Music - search
  mode: restart
  sequence:
    - event: music_search_requested

bedroom_temperature_early_bedtime:
  alias: Bedroom temperature - early bedtime
  mode: single
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.bedroom_temperature_override
    data:
      option: Bedroom
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bedroom_temperature_override_until
    data:
      datetime: >-
        {{ (today_at('08:00') + timedelta(days=1) if now() >= today_at('08:00')
            else today_at('08:00')).strftime('%Y-%m-%d %H:%M:%S') }}
  - action: script.bedroom_temperature_apply

wake_up:
  alias: Wake up
  description: Return temperature control to Hallway until the next 10 pm schedule or Bedtime run.
  icon: mdi:weather-sunset-up
  mode: single
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.bedroom_temperature_override
    data:
      option: Hallway
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bedroom_temperature_override_until
    data:
      datetime: >-
        {{ (today_at('22:00') + timedelta(days=1) if now() >= today_at('22:00')
            else today_at('22:00')).strftime('%Y-%m-%d %H:%M:%S') }}
  - action: script.bedroom_temperature_apply

bedroom_temperature_apply:
  alias: Bedroom temperature - apply schedule
  description: Select Bedroom overnight only while someone is home, respecting temporary bedtime and wake-up overrides.
  mode: queued
  max: 3
  sequence:
  - variables:
      bedroom_requested: >-
        {% set expires = as_timestamp(states('input_datetime.bedroom_temperature_override_until'), 0) %}
        {{ states('zone.home') | int(0) > 0 and
           (is_state('input_select.bedroom_temperature_override', 'Bedroom')
            if as_timestamp(now()) < expires else (now().hour >= 22 or now().hour < 8)) }}
  # Retry automatically on recovery; never send a command to an unavailable sensor.
  - condition: template
    value_template: "{{ states('switch.bedroom_bedroom_sensor_control_thermostat') in ['on', 'off'] }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ bedroom_requested and not is_state('switch.bedroom_bedroom_sensor_control_thermostat', 'on') }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bedroom_bedroom_sensor_control_thermostat
    - conditions:
      - condition: template
        value_template: "{{ not bedroom_requested and is_state('switch.bedroom_bedroom_sensor_control_thermostat', 'on') }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.bedroom_bedroom_sensor_control_thermostat
