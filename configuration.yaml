# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate

sensor:
  - platform: time_date
    display_options:
      - "time"
      - "date"
      - "date_time"
      - "date_time_utc"
      - "date_time_iso"
      - "time_date"
      - "time_utc"

# Remember the selected listening destination across both dashboards.
input_select:
  music_destination:
    name: Music destination
    icon: mdi:speaker-multiple
    options:
      - Main Floor
      - Everywhere
      - Bedroom
      - Basement
      - Record Player

input_boolean:
  chicken_plug_offline_alert_active:
    name: Chicken plug offline alert active
    icon: mdi:power-plug-off-outline
  chicken_door_open_alert_active:
    name: Chicken door open alert active
    icon: mdi:alert-circle-outline
  chicken_door_close_alert_active:
    name: Chicken door close alert active
    icon: mdi:alert-circle-outline

input_datetime:
  nightly_light_cutoff:
    name: Nightly light cutoff
    has_date: false
    has_time: true
    initial: '02:00:00'

lovelace:
  resource_mode: yaml
  resources:
    - type: module
      url: /local/dashboard/music-hotkeys.js?v=2
    - type: module
      url: /local/community/lovelace-card-mod/card-mod.js
    - type: module
      url: /local/community/lovelace-layout-card/layout-card.js?v=20261028
    - type: module
      url: /local/community/mini-media-player/mini-media-player-bundle.js
    - type: module
      url: /local/community/config-template-card/config-template-card.js
    - type: module
      url: /local/community/button-card/button-card.js?v=20261028
    - type: module
      url: /local/community/lovelace-state-switch/state-switch.js
    - type: css
      url: /local/style.css
    - url: /local/community/clock-weather-card/clock-weather-card.js?v=3.1.0
      type: module
  dashboards:
    lovelace-main-panel:
      mode: yaml
      icon: mdi:home
      title: Main Panel
      filename: dashboards/main-panel.yaml
      show_in_sidebar: true
      require_admin: false

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
light: !include lights.yaml
group: !include groups.yaml

# Shared dashboard data: music rows and chicken alert summary.
template: !include_dir_merge_list templates/

# Search the Music Assistant library and connected providers from either Music tab.
input_text:
  music_search_query:
    name: Search music
    icon: mdi:magnify
    max: 100
    mode: text
