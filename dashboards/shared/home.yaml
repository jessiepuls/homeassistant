# Main Home view: native Sections with shared chicken alert navigation.
title: Home
path: home
icon: mdi:home
show_icon_and_title: true
type: sections
max_columns: 3
dense_section_placement: false
badges:
- type: entity
  entity: sensor.chicken_coop_alerts
  name: Chicken alerts
  icon: mdi:alert-circle
  color: orange
  show_name: true
  show_state: true
  visibility:
  - condition: numeric_state
    entity: sensor.chicken_coop_alerts
    above: 0
  tap_action:
    action: navigate
    navigation_path: /lovelace-main-panel/chicken-coop
sections:
- !include home-mobile.yaml
- type: grid
  visibility:
  - condition: screen
    media_query: "(min-width: 768px)"
  cards:
  - type: custom:mod-card
    grid_options:
      columns: full
      rows: auto
    card_mod:
      style:
        .: |
          /* Match three 840 x 525 room photos, their borders, and two section gaps. */
          :host { display: block; }
          ha-card {
            container-type: inline-size;
            border: none;
            padding: 0;
            background: none;
            box-shadow: none;
          }
          hui-vertical-stack-card {
            display: block;
            height: calc(187.5cqw + 2 * var(--ha-section-grid-row-gap, 8px) + 3px);
            min-height: 0;
          }
          @media (max-width: 768px) {
            hui-vertical-stack-card { height: auto; }
          }
        hui-vertical-stack-card$: |
          :host { display: block; }
          #root {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: var(--ha-section-grid-row-gap, 8px);
          }
          #root > * { display: block; margin: 0 !important; }
          #root > :first-child { flex: 0 0 auto; height: auto; }
          #root > :first-child clock-weather-card { display: block; height: auto; }
          #root > :last-child { flex: 1 0 270px; min-height: 270px; }
          @media (max-width: 768px) {
            #root { height: auto; }
            #root > :last-child { flex: 0 0 auto; }
          }
    card:
      type: vertical-stack
      cards:
      - type: custom:clock-weather-card
        entity: weather.openweathermap
        sections:
          forecast_list:
            count: 3
      - type: custom:dashboard-media-player
        entity: media_player.living_room_2
        compact: true
        listen_path: /lovelace-main-panel/music
