                grid-template-rows: min-content
              cards: |-
                ${(states[vars[0]]?.attributes.uri === states['input_text.music_podcast_selected']?.state ? (states[vars[0]]?.attributes.items || []) : []).filter(item => item.uri).map(item => ({
