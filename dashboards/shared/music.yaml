                service_data: {entity_id: vars[1], value: item.uri}
              },
              styles: {
                card: [{height: '184px'}, {padding: '8px'}, {'box-shadow': 'none'},
                  {outline: item.uri === states[vars[1]]?.state ? '2px solid var(--primary-color)' : 'none'}, {'outline-offset': '-2px'}],
                grid: [{'grid-template-areas': '"i" "n"'}, {'grid-template-rows': '132px 1fr'}],
                img_cell: [{height: '128px'}],
