porch_tile:
  show_icon: true
  show_state: true
  color_type: icon
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  state:
    - value: "on"
      styles:
        card:
          - background: rgba(255, 180, 50, 0.12)
          - border-color: rgba(255, 180, 50, 0.35)
        icon:
          - color: var(--warning-color)
        state:
          - color: var(--warning-color)
  styles:
    card:
      - height: 100%
      - min-height: 112px
      - padding: 16px
      - margin: 0
      - box-sizing: border-box
      - box-shadow: none
    grid:
      - grid-template-areas: '"i" "n" "s"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content min-content min-content
      - align-content: center
      - row-gap: 8px
    img_cell:
      - justify-self: start
      - width: 28px
      - height: 28px
    icon:
      - width: 26px
      - color: var(--secondary-text-color)
    name:
      - justify-self: start
    state:
      - justify-self: start
      - font-size: 12px
      - color: var(--secondary-text-color)
