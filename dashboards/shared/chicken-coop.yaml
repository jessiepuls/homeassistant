title: Chickens
show_icon_and_title: true
path: chicken-coop
icon: mdi:egg
panel: true
badges: []
cards:
  - type: custom:layout-card
    layout_type: grid
    layout:
      card_margin: 0px
      box-sizing: border-box
      padding: 8px
      grid-gap: 8px
      grid-template-columns: 1fr 1fr 1fr
      align-items: start
      grid-template-rows: auto auto
      grid-template-areas: |
        "controls power activity"
        "automation automation automation"
      mediaquery:
        "(max-width: 768px)":
          height: auto
          grid-template-columns: 1fr
          grid-template-rows: auto
          grid-template-areas: |
            "controls"
            "power"
            "activity"
            "automation"
    cards:
      - type: vertical-stack
        title: Controls
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: clamp(520px, 44vw, 720px);
            }
            #root {
              justify-content: space-between;
              flex: 1;
              min-height: 0;
            }
            @media (max-width: 768px) {
              :host { height: auto; }
            }
        view_layout:
          grid-area: controls
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: cover.coop_door
                name: Coop Door
                state_content: state
                features:
                  - type: cover-open-close
              - type: tile
                entity: cover.run_door_door
                name: Run Door
                state_content: state
                features:
                  - type: cover-open-close

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: cover.jessica_s_feeder_feeder
                name: Feeder 1
                state_content: state
                tap_action:
                  action: more-info
              - type: tile
                entity: cover.feeder2_feeder
                name: Feeder 2
                state_content: state
                tap_action:
                  action: more-info

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: switch.chicken_coop_lights
                name: Run light
                icon: mdi:lightbulb-outline
                show_state: true
                color_type: icon
                state:
                  - value: 'on'
                    color: var(--state-switch-active-color, var(--amber-color))
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:button-card
                entity: switch.chicken_coop_waterer1
                name: Water heater 1
                icon: mdi:water-boiler
                show_state: true
                color_type: icon
                state:
                  - value: 'on'
                    color: var(--state-switch-active-color, var(--amber-color))
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - type: custom:button-card
                entity: switch.chicken_coop_waterer2
                name: Water heater 2
                icon: mdi:water-boiler
                show_state: true
                color_type: icon
                state:
                  - value: 'on'
                    color: var(--state-switch-active-color, var(--amber-color))
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
          - type: entities
            title: Automations
            show_header_toggle: false
            entities:
              - entity: automation.open_chicken_coop_door
                name: Morning opening
              - entity: automation.close_coop_door
                name: Nightly closing
              - entity: automation.chicken_coop_waterer_freeze_protection
                name: Waterer freeze protection

      - type: grid
        title: Feed and power levels
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: clamp(520px, 44vw, 720px);
            }
            #root { flex: 1; min-height: 0; }
            @media (max-width: 768px) {
              :host { height: auto; }
            }
        columns: 2
        square: false
        view_layout:
          grid-area: power
        cards:
          - type: gauge
            entity: sensor.jessica_s_feeder_feed_level
            name: Feeder 1 feed
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 30
              green: 50
          - type: gauge
            entity: sensor.feeder2_feed_level
            name: Feeder 2 feed
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 30
              green: 50
          - type: gauge
            entity: sensor.coop_door_battery_level_2
            name: Coop battery
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50
          - type: gauge
            entity: sensor.run_door_battery_level
            name: Run battery
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50

          - type: gauge
            entity: sensor.jessica_s_feeder_battery_level
            name: Feeder 1 battery
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50
          - type: gauge
            entity: sensor.feeder2_battery_level
            name: Feeder 2 battery
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50

      - type: vertical-stack
        title: Activity
        card_mod:
          style: |
            :host {
              display: flex;
              flex-direction: column;
              height: clamp(520px, 44vw, 720px);
            }
            #root {
              flex: 1;
              min-height: 0;
            }
            @media (max-width: 768px) {
              :host { height: auto; }
            }
        view_layout:
          grid-area: activity
        cards:
          - type: logbook
            hours_to_show: 24
            card_mod:
              style: |
                :host { height: 100%; min-height: 0; }
                ha-card { height: 100%; overflow-y: auto; }
                @media (max-width: 768px) {
                  :host { height: 480px; }
                }
            entities:
              - cover.coop_door
              - cover.run_door_door
              - cover.jessica_s_feeder_feeder
              - cover.feeder2_feeder
              - switch.chicken_coop_lights
              - switch.chicken_coop_waterer1
              - switch.chicken_coop_waterer2

      - type: vertical-stack
        view_layout:
          grid-area: automation
        cards:
          - type: entity-filter
            card:
              type: entities
              title: Attention needed
              show_header_toggle: false
            show_empty: false
            entities:
              - entity: sensor.coop_door_door_fault
                conditions:
                  - condition: state
                    state_not: none
              - entity: sensor.run_door_door_fault
                conditions:
                  - condition: state
                    state_not: none
              - entity: sensor.jessica_s_feeder_feeder_fault
                conditions:
                  - condition: state
                    state_not: none
              - entity: sensor.feeder2_feeder_fault
                conditions:
                  - condition: state
                    state_not: none
              - cover.coop_door
              - cover.run_door_door
              - cover.jessica_s_feeder_feeder
              - cover.feeder2_feeder
              - switch.chicken_coop_lights
              - switch.chicken_coop_waterer1
              - switch.chicken_coop_waterer2
            conditions:
              - condition: state
                state:
                  - unavailable
                  - unknown
