title: Porch
path: porch
icon: mdi:fireplace
show_icon_and_title: true
panel: true
badges: []
cards:
  - type: custom:layout-card
    layout_type: grid
    layout:
      card_margin: 0px
      height: calc(100vh - var(--header-height, 0px) - 4px)
      box-sizing: border-box
      padding: 8px
      grid-gap: 12px
      grid-template-columns: 2.1fr 1fr 1fr
      grid-template-rows: auto 1fr 1fr auto
      grid-template-areas: |
        "media climate climate"
        "media lamp table"
        "media string ceiling"
        "media fan fan"
      mediaquery:
        "(max-width: 768px)":
          height: auto
          grid-template-columns: 1fr 1fr
          grid-template-rows: auto
          grid-template-areas: |
            "media media"
            "climate climate"
            "lamp table"
            "string ceiling"
            "fan fan"
    cards:
      - type: custom:dashboard-media-player
        entity: media_player.three_season_porch
        listen_path: /lovelace-main-panel/music
        view_layout:
          grid-area: media
      - type: custom:button-card
        entity: sensor.three_season_porch_three_season_porch_sensor_temperature
        icon: mdi:thermometer
        show_name: false
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: climate
        styles:
          card:
            - padding: 16px
            - box-shadow: none
          grid:
            - grid-template-areas: '"i s heater"'
            - grid-template-columns: 24px 1fr calc((100% - 12px) / 2)
            - column-gap: 8px
          icon:
            - width: 22px
            - color: var(--secondary-text-color)
          state:
            - justify-self: start
            - font-size: clamp(24px, 3.5vw, 42px)
            - font-weight: 500
          custom_fields:
            heater:
              - width: 100%
        custom_fields:
          heater:
            card:
              type: custom:button-card
              entity: switch.heater
              name: Heater
              icon: mdi:fireplace
              show_icon: true
              show_state: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              state:
                - value: "on"
                  styles:
                    card:
                      - background: rgba(255, 180, 50, 0.12)
                      - border-color: rgba(255, 180, 50, 0.35)
                    icon:
                      - color: var(--warning-color)
                    state:
                      - color: var(--warning-color)
              styles:
                card:
                  - padding: 12px
                  - min-height: 68px
                  - box-shadow: none
                  - background: var(--secondary-background-color)
                  - border: 1px solid var(--divider-color)
                  - border-radius: 10px
                  - cursor: pointer
                grid:
                  - grid-template-areas: '"i" "n" "s"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: min-content min-content min-content
                  - align-content: center
                  - row-gap: 6px
                img_cell:
                  - justify-self: start
                  - width: 24px
                  - height: 24px
                icon:
                  - width: 24px
                  - color: var(--secondary-text-color)
                name:
                  - justify-self: start
                state:
                  - justify-self: start
                  - font-size: 12px
                  - color: var(--secondary-text-color)
      - type: custom:button-card
        template: porch_tile
        entity: light.three_season_porch_lamp2
        name: Floor Lamp
        icon: mdi:floor-lamp
        view_layout:
          grid-area: lamp
      - type: custom:button-card
        template: porch_tile
        entity: light.three_season_porch_table_lamp
        name: Table Lamp
        icon: mdi:lamp
        view_layout:
          grid-area: table
      - type: custom:button-card
        template: porch_tile
        entity: light.three_season_porch_string_lights
        name: String Lights
        icon: mdi:string-lights
        view_layout:
          grid-area: string
      - type: custom:button-card
        template: porch_tile
        entity: light.three_season_porch_ceiling_fan
        name: Ceiling Light
        icon: mdi:ceiling-light
        view_layout:
          grid-area: ceiling
      - type: custom:button-card
        entity: fan.three_season_porch_ceiling_fan
        name: Fan
        show_icon: false
        show_state: true
        tap_action:
          action: none
        view_layout:
          grid-area: fan
        styles:
          card:
          - padding: 16px
          - box-shadow: none
          grid:
          - grid-template-areas: '"n s" "controls controls"'
          - grid-template-columns: 1fr auto
          - row-gap: 12px
          name:
          - justify-self: start
          state:
          - font-size: 12px
          - color: var(--secondary-text-color)
        custom_fields:
          controls:
            card:
              type: horizontal-stack
              cards:
              - type: custom:button-card
                entity: fan.three_season_porch_ceiling_fan
                name: 'Off'
                show_icon: false
                tap_action:
                  action: call-service
                  service: fan.turn_off
                  service_data:
                    entity_id: fan.three_season_porch_ceiling_fan
                state:
                - operator: template
                  value: '[[[ return entity && entity.state === ''off''; ]]]'
                  styles:
                    card:
                    - background: var(--primary-color)
                    - border-color: var(--primary-color)
                    name:
                    - color: var(--text-primary-color)
                styles:
                  card:
                  - min-height: 42px
                  - padding: 8px 4px
                  - border-radius: 10px
                  - box-shadow: none
                  name:
                  - font-size: 13px
              - type: custom:button-card
                entity: fan.three_season_porch_ceiling_fan
                name: Low
                show_icon: false
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.three_season_porch_ceiling_fan
                    percentage: 33
                state:
                - operator: template
                  value: '[[[ return entity && entity.state === ''on'' && Math.max(1, Math.round((entity.attributes.percentage || 0) * 3 / 100)) === 1; ]]]'
                  styles:
                    card:
                    - background: var(--primary-color)
                    - border-color: var(--primary-color)
                    name:
                    - color: var(--text-primary-color)
                styles:
                  card:
                  - min-height: 42px
                  - padding: 8px 4px
                  - border-radius: 10px
                  - box-shadow: none
                  name:
                  - font-size: 13px
              - type: custom:button-card
                entity: fan.three_season_porch_ceiling_fan
                name: Med
                show_icon: false
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.three_season_porch_ceiling_fan
                    percentage: 66
                state:
                - operator: template
                  value: '[[[ return entity && entity.state === ''on'' && Math.max(1, Math.round((entity.attributes.percentage || 0) * 3 / 100)) === 2; ]]]'
                  styles:
                    card:
                    - background: var(--primary-color)
                    - border-color: var(--primary-color)
                    name:
                    - color: var(--text-primary-color)
                styles:
                  card:
                  - min-height: 42px
                  - padding: 8px 4px
                  - border-radius: 10px
                  - box-shadow: none
                  name:
                  - font-size: 13px
              - type: custom:button-card
                entity: fan.three_season_porch_ceiling_fan
                name: High
                show_icon: false
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.three_season_porch_ceiling_fan
                    percentage: 100
                state:
                - operator: template
                  value: '[[[ return entity && entity.state === ''on'' && Math.max(1, Math.round((entity.attributes.percentage || 0) * 3 / 100)) === 3; ]]]'
                  styles:
                    card:
                    - background: var(--primary-color)
                    - border-color: var(--primary-color)
                    name:
                    - color: var(--text-primary-color)
                styles:
                  card:
                  - min-height: 42px
                  - padding: 8px 4px
                  - border-radius: 10px
                  - box-shadow: none
                  name:
                  - font-size: 13px
