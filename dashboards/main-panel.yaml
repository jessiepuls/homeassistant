views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          grid-template-columns: repeat(3, 1fr)
          mediaquery:
            "(max-width: 768px)":
              grid-template-columns: 1fr
            "(min-width: 769px) and (max-width: 1024px)":
              grid-template-columns: repeat(2, 1fr)
        cards:

          # Top row: Weather & Sonos
          - type: custom:clock-weather-card
            entity: weather.openweathermap
            view_layout:
              grid-column: span 2

          - type: custom:sonos-card

          # Area cards
          - type: entities
            title: Living Room
            entities:
              - type: buttons
                entities:
                  - entity: light.living_room_lamps
                    name: Lamps
                    icon: mdi:lightbulb-outline
                  - entity: light.livingroom
                    name: Lights
                    icon: mdi:lightbulb-outline
                  - entity: fan.ceiling_fan
                    name: Fan
                    icon: mdi:ceiling-fan
              - type: conditional
                conditions:
                  - condition: state
                    entity: light.christmas_tree
                    state_not: unavailable
                row:
                  type: buttons
                  entities:
                    - entity: light.christmas_tree
                      name: Christmas Tree
                      icon: mdi:pine-tree

          - type: entities
            title: Kitchen
            entities:
              - type: buttons
                entities:
                  - entity: light.kitchen_cabinets
                    name: Cabinets
                    icon: mdi:led-strip-variant
                  - entity: light.kitchen_main_lights
                    name: Overhead
                    icon: mdi:wall-sconce-flat

          - type: entities
            title: Dining Room
            entities:
              - type: buttons
                entities:
                  - entity: light.dining_room_ceiling_fan_light
                    name: Lights
                    icon: mdi:ceiling-light

          - type: entities
            title: Outdoors
            entities:
              - type: buttons
                entities:
                  - entity: group.outdoor
                    name: All Outdoor
                    icon: mdi:string-lights

          - type: entities
            title: Hallway & Stairs
            entities:
              - type: buttons
                entities:
                  - entity: light.hallway_main_lights
                    name: Hallway
                    icon: mdi:wall-sconce-flat
                  - entity: light.stairs_main_lights
                    name: Stairs
                    icon: mdi:stairs
                  - entity: climate.hallway
                    name: Thermostat
                    icon: mdi:thermostat
                    tap_action:
                      action: more-info

          - type: entities
            title: Actions
            entities:
              - type: buttons
                entities:
                  - entity: automation.bedtime
                    name: Bedtime
                    icon: mdi:sleep
                    tap_action:
                      action: perform-action
                      perform_action: automation.trigger
                      target:
                        entity_id: automation.bedtime
