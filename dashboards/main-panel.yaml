views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          card_margin: 0px
          height: calc(100vh - var(--header-height, 0px) - 8px)
          box-sizing: border-box
          padding: 8px
          grid-gap: 8px
          grid-template-columns: 0.55fr 0.55fr 0.5fr 0.5fr 0.5fr 0.5fr
          grid-template-rows: repeat(6, 1fr)
          grid-template-areas: |
            "rail rail living living kitchen kitchen"
            "rail rail living living kitchen kitchen"
            "rail rail dining dining bedroom bedroom"
            "rail rail dining dining bedroom bedroom"
            "rail rail outdoors outdoors hallway hallway"
            "rail rail outdoors outdoors hallway hallway"
          mediaquery:
            "(max-width: 768px)":
              height: auto
              grid-template-columns: 1fr
              grid-template-rows: auto
              grid-template-areas: |
                "rail"
                "living"
                "kitchen"
                "dining"
                "bedroom"
                "outdoors"
                "hallway"
        cards:

          - type: vertical-stack
            view_layout:
              grid-area: rail
            cards:
              - type: custom:clock-weather-card
                entity: weather.openweathermap
                forecast_rows: 3
              - type: custom:sonos-card
                heightPercentage: 83

          - type: picture-elements
            image: /local/room-placeholder.svg
            view_layout:
              grid-area: living
            elements:
              - type: custom:button-card
                name: Living Room
                show_icon: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: none
                    - border: none
                    - box-shadow: none
                    - padding: 0
                  name:
                    - font-size: 15px
                    - font-weight: 500
                style:
                  top: 12%
                  left: 4%
                  transform: none
              - type: icon
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    area_id: living_room
                style:
                  top: 12%
                  right: 4%
                  transform: none
              - type: state-icon
                entity: light.living_room_lamps
                icon: mdi:lamp
                tap_action:
                  action: toggle
                style:
                  top: 75%
                  left: 15%
              - type: state-icon
                entity: light.livingroom
                icon: mdi:lightbulb-group-outline
                tap_action:
                  action: toggle
                style:
                  top: 75%
                  left: 38%
              - type: state-icon
                entity: fan.ceiling_fan
                icon: mdi:ceiling-fan
                tap_action:
                  action: toggle
                style:
                  top: 75%
                  left: 61%
              - type: custom:button-card
                entity: fan.ceiling_fan
                show_name: false
                show_state: false
                icon: mdi:circle
                size: 10px
                tap_action:
                  action: perform-action
                  perform_action: fan.set_percentage
                  target:
                    entity_id: fan.ceiling_fan
                  data:
                    percentage: 33
                state:
                  - operator: template
                    value: "[[[ return entity.state === 'on' && Math.round(entity.attributes.percentage) === 33 ]]]"
                    color: var(--state-fan-active-color, var(--state-active-color, var(--paper-item-icon-active-color)))
                color: var(--disabled-text-color)
                styles:
                  card:
                    - background: none
                    - border: none
                    - box-shadow: none
                    - width: 22px
                    - height: 22px
                    - padding: 0
                style:
                  top: 75%
                  left: 70%
              - type: custom:button-card
                entity: fan.ceiling_fan
                show_name: false
                show_state: false
                icon: mdi:circle
                size: 10px
                tap_action:
                  action: perform-action
                  perform_action: fan.set_percentage
                  target:
                    entity_id: fan.ceiling_fan
                  data:
                    percentage: 66
                state:
                  - operator: template
                    value: "[[[ return entity.state === 'on' && Math.round(entity.attributes.percentage) === 67 ]]]"
                    color: var(--state-fan-active-color, var(--state-active-color, var(--paper-item-icon-active-color)))
                color: var(--disabled-text-color)
                styles:
                  card:
                    - background: none
                    - border: none
                    - box-shadow: none
                    - width: 22px
                    - height: 22px
                    - padding: 0
                style:
                  top: 75%
                  left: 76%
              - type: custom:button-card
                entity: fan.ceiling_fan
                show_name: false
                show_state: false
                icon: mdi:circle
                size: 10px
                tap_action:
                  action: perform-action
                  perform_action: fan.set_percentage
                  target:
                    entity_id: fan.ceiling_fan
                  data:
                    percentage: 100
                state:
                  - operator: template
                    value: "[[[ return entity.state === 'on' && entity.attributes.percentage === 100 ]]]"
                    color: var(--state-fan-active-color, var(--state-active-color, var(--paper-item-icon-active-color)))
