views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          card_margin: 0px
          height: calc(100vh - var(--header-height, 0px) - 8px)
          box-sizing: border-box
          padding: 8px
          grid-gap: 8px
          # Allow tracks to shrink below the custom cards' intrinsic sizes.
          grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: repeat(3, minmax(0, 1fr))
          grid-template-areas: |
            "rail living kitchen"
            "rail dining bedroom"
            "rail outdoors hallway"
          mediaquery:
            "(max-width: 768px)":
              height: auto
              grid-template-columns: minmax(0, 1fr)
              grid-template-rows: auto
              grid-template-areas: |
                "rail"
                "living"
                "kitchen"
                "dining"
                "bedroom"
                "outdoors"
                "hallway"
        cards:

          - type: custom:layout-card
            layout_type: grid
            view_layout:
              grid-area: rail
            layout:
              height: 100%
              margin: 0px
              padding: 0px
              card_margin: 0px
              grid-gap: 8px
              grid-template-columns: minmax(0, 1fr)
              grid-template-rows: auto minmax(140px, 1fr)
              mediaquery:
                "(max-width: 768px)":
                  grid-template-rows: auto auto
            cards:
              - type: custom:clock-weather-card
                entity: weather.openweathermap
                sections:
                  forecast_list:
                    count: 3
              - type: custom:mod-card
                card_mod:
                  style:
                    .: |
                      :host { display: block; height: 100%; min-height: 0; }
                      ha-card {
                        height: 100%;
                        min-height: 140px;
                        padding: 0;
                        border: none;
                        background: none;
                        box-shadow: none;
                      }
                      state-switch { display: block; height: 100%; }
                    state-switch$:
                      .: |
                        :host { display: block; height: 100%; }
                        #root { height: 100%; grid-template-rows: minmax(0, 1fr) 0px; box-sizing: border-box; }
                        #root > div.visible { height: 100%; min-height: 0; }
                        mini-media-player { display: block; height: 100%; }
                      mini-media-player$: |
                        :host { height: 100%; }
                        ha-card { height: 100%; min-height: 140px; }
                        .mmp-player { margin-top: auto; width: 100%; }
                card:
                  type: custom:state-switch
                  entity: template
                  template: '{{ ''grouped'' if (state_attr(''media_player.living_room_2'', ''group_members'') or []) | length > 1 else ''solo'' }}'
                  default: solo
                  card_mod:
                    style: |
                      :host { display: block; height: 100%; min-height: 0; }
                      #root { height: 100%; grid-template-rows: minmax(0, 1fr) 0px; box-sizing: border-box; }
                      #root > div.visible { height: 100%; min-height: 0; }
                      mini-media-player { display: block; height: 100%; }
                  states:
                    solo:
                      type: custom:mini-media-player
                      entity: media_player.living_room_2
                      name: Living Room
                      artwork: cover
                      card_mod:
                        style: |
                          :host {
                            height: 100%;
                          }
                          ha-card {
                            height: 100%;
                            min-height: 140px;
                            box-sizing: border-box;
                          }
                          .mmp-player {
                            background: linear-gradient(
                              to top,
                              rgba(0, 0, 0, 0.85),
                              rgba(0, 0, 0, 0.25)
                            );
                          }
                      hide:
                        power: true
                        source: true
                        group_button: true
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace-main-panel/music
                      speaker_group:
                        platform: media_player
                        sync_volume: false
                        entities:
                        - entity_id: media_player.living_room_2
                          name: Living Room
                        - entity_id: media_player.office_2
                          name: Office
                        - entity_id: media_player.dining_room_2
                          name: Dining Room
                        - entity_id: media_player.three_season_porch
                          name: Three Season Porch
                        - entity_id: media_player.bedroom_2
                          name: Bedroom
                        - entity_id: media_player.basement_2
                          name: Basement
                        - entity_id: media_player.record_player
                          name: Record Player
                    grouped:
                      type: custom:mini-media-player
                      entity: media_player.living_room_2
                      name: Living Room
                      artwork: cover
                      card_mod:
                        style: |
                          :host {
                            height: 100%;
                          }
                          ha-card {
                            height: 100%;
                            min-height: 140px;
                            box-sizing: border-box;
                          }
                          .mmp-player {
                            background: linear-gradient(
                              to top,
                              rgba(0, 0, 0, 0.85),
                              rgba(0, 0, 0, 0.25)
                            );
                          }
                      hide:
                        power: true
                        source: true
                        group_button: true
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace-main-panel/music
                      speaker_group:
                        platform: media_player
                        sync_volume: true
                        entities:
                        - entity_id: media_player.living_room_2
                          name: Living Room
                        - entity_id: media_player.office_2
                          name: Office
                        - entity_id: media_player.dining_room_2
                          name: Dining Room
                        - entity_id: media_player.three_season_porch
                          name: Three Season Porch
                        - entity_id: media_player.bedroom_2
                          name: Bedroom
                        - entity_id: media_player.basement_2
                          name: Basement
                        - entity_id: media_player.record_player
                          name: Record Player
