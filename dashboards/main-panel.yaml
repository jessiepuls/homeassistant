views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          card_margin: 0px
          height: calc(100vh - var(--header-height, 0px) - 8px)
          box-sizing: border-box
          padding: 8px
          grid-gap: 8px
          grid-template-columns: 1.1fr 1fr 1fr
          grid-template-rows: 1fr 1fr 1fr
          grid-template-areas: |
            "rail living kitchen"
            "rail dining bedroom"
            "rail outdoors hallway"
          mediaquery:
            "(max-width: 768px)":
              height: auto
              grid-template-columns: 1fr
              grid-template-rows: auto
              grid-template-areas: |
                "rail"
                "living"
                "kitchen"
                "dining"
                "bedroom"
                "outdoors"
                "hallway"
        cards:

          - type: vertical-stack
            view_layout:
              grid-area: rail
            cards:
              - type: custom:clock-weather-card
                entity: weather.openweathermap
                forecast_rows: 3
              - type: custom:sonos-card
                heightPercentage: 83

          - type: picture-elements
            image: /local/photos/living.jpg?v=5
            view_layout:
              grid-area: living
            elements:
              - type: image
                image: /local/scrim.svg?v=5
                style:
                  left: 50%
                  bottom: 0%
                  transform: translateX(-50%)
                  width: 100%
                  height: 26%
                  pointer-events: none
              - type: custom:button-card
                name: Living Room
                show_icon: false
                tap_action:
                  action: none
                styles:
                  card:
                    - background: rgba(0, 0, 0, 0.5)
                    - border: none
                    - box-shadow: none
                    - padding: 2px 10px
                    - border-radius: 6px
                  name:
                    - font-size: 15px
                    - font-weight: 500
                    - color: white
                style:
                  top: 13%
                  left: 5%
                  transform: none
              - type: custom:button-card
                icon: mdi:power
                show_name: false
                size: 22px
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    area_id: living_room
                styles:
                  card:
                    - background: rgba(0, 0, 0, 0.5)
                    - border-radius: 50%
                    - padding: 5px
                    - box-shadow: none
                    - border: none
                  icon:
                    - color: white
                style:
                  top: 13%
                  right: 5%
                  transform: none
              - type: custom:button-card
                entity: light.living_room_lamps
                icon: mdi:lamp
                show_name: false
                show_state: false
                color_type: icon
                size: 22px
                tap_action:
                  action: toggle
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - border: none
                    - width: 34px
                    - height: 34px
                    - padding: 0
                style:
                  bottom: 5%
                  left: 10%
                  transform: translateX(-50%)
              - type: custom:button-card
                entity: light.livingroom
                icon: mdi:lightbulb-group-outline
                show_name: false
                show_state: false
                color_type: icon
                size: 22px
                tap_action:
                  action: toggle
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - border: none
                    - width: 34px
                    - height: 34px
                    - padding: 0
                style:
                  bottom: 5%
                  left: 26%
                  transform: translateX(-50%)
              - type: custom:button-card
                entity: fan.ceiling_fan
                icon: mdi:ceiling-fan
                show_name: false
                show_state: false
                color_type: icon
                size: 22px
                tap_action:
                  action: toggle
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - border: none
                    - width: 34px
                    - height: 34px
                    - padding: 0
                style:
                  bottom: 5%
                  left: 44%
                  transform: translateX(-50%)
              - type: custom:button-card
                entity: fan.ceiling_fan
                icon: mdi:circle
                size: 9px
                show_name: false
                show_state: false
                color: var(--disabled-text-color)
                tap_action:
                  action: perform-action
                  perform_action: fan.set_percentage
                  target:
                    entity_id: fan.ceiling_fan
                  data:
                    percentage: 33
                state:
                  - operator: template
                    value: "[[[ return entity.state === 'on' && Math.round(entity.attributes.percentage) === 33 ]]]"
                    color: var(--state-fan-active-color, var(--state-active-color, var(--paper-item-icon-active-color)))
                styles:
                  card:
                    - background: none
