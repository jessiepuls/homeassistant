views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:clock-weather-card
                entity: weather.openweathermap
              - type: thermostat
                entity: climate.hallway
              - type: custom:sonos-card
          - type: horizontal-stack
            cards:
              - type: button
                icon: mdi:lightbulb-outline
                tap_action:
                  action: toggle
                entity: light.living_room_lamps
                show_state: true
                name: Livingroom Lamps
              - type: button
                icon: mdi:lightbulb-outline
                tap_action:
                  action: toggle
                entity: light.livingroom
                show_state: true
                name: Livingroom Lights
              - type: button
                icon: mdi:ceiling-fan
                tap_action:
                  action: toggle
                entity: fan.ceiling_fan
                show_state: true
                name: Livingroom Fan
              - type: conditional
                conditions:
                  - condition: state
                    entity: light.christmas_tree
                    state_not: unavailable
                card:
                  type: custom:button-card
                  icon: mdi:pine-tree
                  tap_action:
                    action: toggle
                  entity: light.christmas_tree
                  show_state: true
                  name: Christmas Tree
                  styles:
                    card:
                      - height: 100%
                    icon:
                      - color: '[[[ if (entity.state == "on") return "green"; else return "red" ]]]'
              - type: button
                tap_action:
                  action: toggle
                entity: light.kitchen_cabinets
                show_state: true
                name: Kitchen Cabinets
                icon: mdi:led-strip-variant
              - type: button
                tap_action:
                  action: toggle
                entity: light.kitchen_main_lights
                show_state: true
                name: Kitchen Overhead
                icon: mdi:wall-sconce-flat
              - type: button
                tap_action:
                  action: toggle
                entity: light.hallway_main_lights
                show_state: true
                name: Hallway
                icon: mdi:wall-sconce-flat
              - type: button
                tap_action:
                  action: toggle
                entity: light.dining_room_ceiling_fan_light
                show_state: true
                name: Dining Room
                icon: mdi:ceiling-light
              - type: button
                tap_action:
                  action: toggle
                entity: group.outdoor
                show_state: true
                icon: mdi:string-lights
                name: Outdoor
              - type: button
                name: Bedtime
                tap_action:
                  action: call-service
                  service: automation.trigger
                  service_data:
                    entity_id: automation.bedtime
                show_state: false
                icon: mdi:sleep
