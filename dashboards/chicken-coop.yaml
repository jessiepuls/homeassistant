views:
  - title: Chicken Coop
    path: chicken-coop
    icon: mdi:door-closed
    badges: []
    cards:
      # Row 1: Main controls
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: cover.coop_door
            name: Coop Door
            show_state: true
            tap_action:
              action: more-info
            state:
              - value: open
                icon: mdi:door-open
                color: green
              - value: closed
                icon: mdi:door-closed
              - value: opening
                icon: mdi:door-open
                color: orange
              - value: closing
                icon: mdi:door-closed
                color: orange
            styles:
              card:
                - height: 150px

          - type: custom:button-card
            entity: cover.jessica_s_feeder_feeder
            name: Feeder
            icon: mdi:food
            show_state: true
            tap_action:
              action: more-info
            state:
              - value: open
                color: green
              - value: closed
                color: var(--primary-text-color)
              - value: opening
                color: orange
              - value: closing
                color: orange
            styles:
              card:
                - height: 150px

          - type: button
            entity: light.coop_door_light
            icon: mdi:lightbulb
            name: Coop Light
            tap_action:
              action: toggle
            show_state: true

      # Row 2: Status gauges
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.jessica_s_feeder_feed_level
            name: Feed Level
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 25
              green: 50

          - type: gauge
            entity: sensor.coop_door_battery_level_2
            name: Door Battery
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 0

          - type: gauge
            entity: sensor.jessica_s_feeder_battery_level
            name: Feeder Battery
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 25
              red: 0

      # Row 3: Last activity
      - type: entities
        title: Last Activity
        entities:
          - entity: sensor.coop_door_last_open_time
            name: Door Last Opened
          - entity: sensor.coop_door_last_close_time
            name: Door Last Closed
          - entity: sensor.jessica_s_feeder_feeder_last_open_time
            name: Feeder Last Opened
          - entity: sensor.jessica_s_feeder_feeder_last_close_time
            name: Feeder Last Closed

      # Row 4: Schedule automations
      - type: horizontal-stack
        cards:
          - type: button
            entity: automation.open_chicken_coop_door
            name: Auto Open Door
            icon: mdi:door-open
            tap_action:
              action: toggle
            show_state: true
          - type: button
            entity: automation.close_coop_door
            name: Auto Close Door
            icon: mdi:door-closed
            tap_action:
              action: toggle
            show_state: true
          - type: button
            entity: automation.chicken_feeder_open_at_sunrise
            name: Auto Open Feeder
            icon: mdi:weather-sunny
            tap_action:
              action: toggle
            show_state: true
          - type: button
            entity: automation.chicken_feeder_close_at_sunset
            name: Auto Close Feeder
            icon: mdi:weather-sunset
            tap_action:
              action: toggle
            show_state: true
