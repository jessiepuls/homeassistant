views:
  - title: Home
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sonos-card
            entityId: media_player.three_season_porch_sonos

          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    icon: mdi:fireplace
                    tap_action:
                      action: toggle
                    entity: switch.heater
                    show_state: true
                    name: Heater
                    state:
                      - color: orange
                        value: "on"
                    styles:
                      card:
                        - height: 100%
                  - type: button
                    tap_action:
                      action: toggle
                    entity: light.three_season_porch_lamp2
                    show_state: true
                    name: Lamp
                    icon: mdi:floor-lamp
                  - type: button
                    tap_action:
                      action: toggle
                    entity: light.three_season_porch_string_lights
                    show_state: true
                    icon: mdi:string-lights
                    name: String Lights
                  - type: button
                    tap_action:
                      action: toggle
                    entity: light.three_season_porch_ceiling_fan
                    show_state: true
                    icon: mdi:ceiling-light
                    name: Ceiling Light
                  - type: button
                    tap_action:
                      action: toggle
                    entity: fan.three_season_porch_ceiling_fan
                    show_state: true
                    icon: mdi:ceiling-fan
                    name: Fan
