name: HA Config Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read HA version
        id: ha
        run: echo "version=$(cat .HA_VERSION)" >> "$GITHUB_OUTPUT"

      # CI validates structure only and never calls the real webhook.
      - name: Supply test-only webhook secret
        run: 'echo "chicken_trmnl_webhook_url: https://example.invalid/trmnl" > secrets.yaml'

      - name: Run HA config check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/config" \
            "homeassistant/home-assistant:${{ steps.ha.outputs.version }}" \
            python -m homeassistant --script check_config --config /config
