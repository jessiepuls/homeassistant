- id: '1748154090198'
  alias: Chicken Coop Door Open
  description: ''
  triggers:
  - trigger: sun
    event: sunrise
    offset: '01:00:00'
  - trigger: time
    at: 07:00:00
  conditions:
  - condition: or
    conditions:
    - condition: device
      device_id: e26628038ef92e9846da78982743feea
      domain: cover
      entity_id: 37429b3d46890887caf19f8ce4a0f3d6
      type: is_closing
    - condition: device
      device_id: e26628038ef92e9846da78982743feea
      domain: cover
      entity_id: 37429b3d46890887caf19f8ce4a0f3d6
      type: is_closed
  actions:
  - device_id: e26628038ef92e9846da78982743feea
    domain: cover
    entity_id: 37429b3d46890887caf19f8ce4a0f3d6
    type: open
  mode: single
- id: '1748275171272'
  alias: Chicken Coop Door Close
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    offset: 00:30:00
  - trigger: time
    at: '21:00:00'
  actions:
  - if:
    - condition: state
      entity_id: cover.coop_door
      state:
      - open
      - opening
    then:
    - action: cover.close_cover
      target:
        entity_id: cover.coop_door
      continue_on_error: true
  - if:
    - condition: state
      entity_id: cover.run_door_door
      state:
      - open
      - opening
    then:
    - action: cover.close_cover
      target:
        entity_id: cover.run_door_door
      continue_on_error: true
  - wait_template: >-
      {{ is_state('cover.coop_door', 'closed') and
         is_state('cover.run_door_door', 'closed') }}
    timeout: '00:06:00'
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: >-
        {{ not (is_state('cover.coop_door', 'closed') and
                is_state('cover.run_door_door', 'closed')) }}
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.chicken_door_close_alert_active
    - action: notify.send_message
      target:
        entity_id: notify.jessies_iphone_17
      data:
        title: Chicken door close failed
        message: >-
          Coop door: {{ states('cover.coop_door') }}. Run door:
          {{ states('cover.run_door_door') }}. Check the Omlet doors.
  mode: single
- id: '1792281600001'
  alias: Chicken doors recovered after close failure
  description: Notify once both doors close after a nightly close-failure alert.
  triggers:
  - trigger: template
    value_template: >-
      {{ is_state('input_boolean.chicken_door_close_alert_active', 'on') and
         is_state('cover.coop_door', 'closed') and
         is_state('cover.run_door_door', 'closed') }}
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.jessies_iphone_17
    data:
      title: Chicken doors recovered
      message: Both the coop door and run door are now closed.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.chicken_door_close_alert_active
  mode: single
