# Each row refreshes independently so a failed recommendation service cannot block the library.
- triggers: &id001
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /10
  - trigger: event
    event_type: music_library_refresh
  - trigger: event
    event_type: event_template_reloaded
  actions:
  - variables:
      music_recommendations_result: {}
  # Queue Actions registers its actions during setup; wait until its entry is loaded.
  - if:
    - condition: template
      value_template: "{{ config_entry_attr('01M6HQY4RZEH5QJ44NT8E5CW5D', 'state') == 'loaded' }}"
    then:
    - action: mass_queue.get_recommendations
      continue_on_error: true
      data:
        entity: media_player.living_room_2
        providers:
        - apple_music
      response_variable: music_recommendations_result
  sensor:
  - name: Music Recommendations
    unique_id: dashboard_music_recommendations
    state: |-
      {% if music_recommendations_result is mapping and 'response' in music_recommendations_result %}
        ready
      {% else %}
        unavailable
      {% endif %}
    attributes:
      items: |-
        {% set ns = namespace(items=[], seen=[]) %} {% for section in music_recommendations_result.get('response', []) %}
          {% for item in section.get('items', []) %}
            {% if item.get('media_type') in ['playlist', 'album', 'radio']
                  and item.get('uri') and item.uri not in ns.seen and ns.items | length < 18 %}
              {% set ns.items = ns.items + [item] %}
              {% set ns.seen = ns.seen + [item.uri] %}
            {% endif %}
          {% endfor %}
        {% endfor %} {{ ns.items }}
      updated_at: '{{ now().isoformat() }}'
- triggers: *id001
  actions:
  - variables:
      music_playlists_result: {}
  - action: music_assistant.get_library
    continue_on_error: true
    data:
      config_entry_id: 01M6HDCTCX7DZ1YYB2NCX1A6FH
      media_type: playlist
      limit: 18
      order_by: last_played_desc
    response_variable: music_playlists_result
  sensor:
  - name: Music Playlists
    unique_id: dashboard_music_playlists
    state: '{{ ''ready'' if ''items'' in music_playlists_result else ''unavailable'' }}'
    attributes:
      items: '{{ music_playlists_result.get(''items'', []) }}'
      updated_at: '{{ now().isoformat() }}'
